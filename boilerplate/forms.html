<!DOCTYPE html>
<html>
    <head>
        <title> Forms</title>
        <link rel="stylesheet" type="text/css" href="includes\stylesheet.css">
        <script src="includes\script.js"></script>
    </head>
    <body> 
        <center> <h1> Forms examples </h1> </center>

        <form>
            <label for=""fname">First name:</label></br>
            <input type="text" id="fname" name="fname"></br>
            <label for="lname">Last name:</label></br>
            <input type="text" id="lname" name="lname"></br></br>

            <label for="Radio"> Displays radio button</label></br>
            <label for="option1">Option 1</label>
            <input type="radio" id="option1" name="options" value="option_1"></br>
            <label for="option2">Option 2</label>
            <input type="radio" id="option2" name="options" value="option_2"></br></br></br>

            <input type="checkbox" id="vehicle1" name="vehicle1" value="Bike">
            <label for="vehicle1"> I have a bike</label></br>

            <input type="checkbox" id="vehicle2" name="vehicle2" value="Car">
            <label for="vehicle2"> I have a car</label></br>

            <input type="checkbox" id="vehicle3" name="vehicle3" value="Boat">
            <label for="vehicle3"> I have a Boat</label></br>

        </form>

        <form action="https://www.w3schools.com/action_page.php"> 
            <label for="fname"> First name</label> <br>
            <input type="text" id="fname" name="fname" value="John"><br>
            <label for="lname"> Last name</label> <br>
            <input type="text" id="lname" name="lname" value="Doe"><br>
            <input type="submit" value="Submit">
        </form>

    </body>
</html>
